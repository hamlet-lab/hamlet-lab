<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잉크 바다의 마지막 문장 — Final Cut / Turn 5</title><style>
html,body{margin:0;height:100%;background:#100f0d;color:#ded5c4;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;place-items:center;overflow:hidden}.wrap{width:min(96vw,1320px);display:flex;flex-direction:column;gap:9px}canvas{width:100%;height:auto;aspect-ratio:16/9;background:#e8dcc3;display:block;box-shadow:0 22px 90px #000b,0 0 0 1px #fff1}.bar{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #fff1;background:#181512;border-radius:10px}.bar button{border:1px solid #ffffff17;background:#28231d;color:#ded5c4;padding:7px 10px;border-radius:7px;font:inherit;cursor:pointer}.bar button:hover{background:#362f27}.bar input{flex:1;min-width:180px;accent-color:#315f82}.meta{display:flex;gap:12px;align-items:center;font-size:11px;opacity:.72;white-space:nowrap}#shot{min-width:205px;text-align:right}@media(max-width:760px){.meta #shot{display:none}.bar{flex-wrap:wrap}.bar input{order:5;flex-basis:100%}}
</style></head><body><div class="wrap"><canvas id="c" width="1280" height="720"></canvas><div class="bar"><button id="play">▶ PLAY</button><button id="mute">🔊 SOUND</button><button id="full">⛶ FULL</button><input id="scrub" type="range" min="0" max="32" step="0.001" value="0"><div class="meta"><span id="time">0.0 / 32.0s</span><span id="shot">SHOT 01</span><span>TURN 5 · FINAL CUT</span></div></div></div><script>
(()=>{
'use strict';
const c=document.getElementById('c'), ctx=c.getContext('2d');
const W=c.width,H=c.height,TAU=Math.PI*2;
const COLORS={paper:'#e8ddc5',paper2:'#d7c6a7',ink:'#151616',ink2:'#252625',blue:'#214d73',blue2:'#5b89a5',sepia:'#735f45',scar:'#bea98b'};
const SHOTS=['01','02','03','04','05','06','07','08','09','10','11','12','13','14','15','16','17','18'];
const DURS={'01':1.5,'02':1.5,'03':1.5,'04':1.5,'05':1.5,'06':1.5,'07':1.5,'08':1.5,'09':1.5,'10':1.5,'11':1.5,'12':1.5,'13':1.5,'14':1.5,'15':1.5,'16':2.0,'17':3.0,'18':4.5};
let selected='01',localP=0,playStart=0;
const shotLabels={'01':'unfinished sentence','02':'the bead wakes','03':'the cobalt clue','04':'running through type','05':'punctuation stones','06':'cobalt puddle','07':'page cliff','08':'beneath the paper','09':'comma boat','10':'torn whirlpool','11':'spine canyon','12':'the dry scar','13':'understanding','14':'capillary return','15':'back at the sentence','16':'not enough ink','17':'become the stroke','18':'cobalt capillary bloom'};

// ---------- deterministic helpers ----------
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453123;return x-Math.floor(x)}
function mix(a,b,t){return a+(b-a)*t}
function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x))}
function ss(t){return t*t*(3-2*t)}
function easeOut(t){return 1-Math.pow(1-clamp(t),3)}
function easeInOut(t){t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function remap(x,a,b,c=0,d=1){return c+(d-c)*clamp((x-a)/(b-a))}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function poly(points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath()}
function ellipse(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU)}

// ---------- paper / print language ----------
let paperPattern=null;
function makePaper(){
  const o=document.createElement('canvas');o.width=640;o.height=360;const g=o.getContext('2d');
  let grd=g.createLinearGradient(0,0,640,360);grd.addColorStop(0,'#eee4d1');grd.addColorStop(.48,'#e4d7bd');grd.addColorStop(1,'#d8c7a8');g.fillStyle=grd;g.fillRect(0,0,640,360);
  for(let i=0;i<3200;i++){
    const x=hash(i*3.11)*640,y=hash(i*7.31+4)*360,ang=(hash(i*11.9)-.5)*.5,len=2+hash(i*2.7)*19;
    g.strokeStyle=hash(i+9)>.5?'rgba(86,69,45,.055)':'rgba(255,255,255,.08)';g.lineWidth=.3+hash(i+3)*.65;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);g.stroke();
  }
  for(let i=0;i<95;i++){
    const x=hash(i*19.1)*640,y=hash(i*23.7)*360,r=1+hash(i*5.4)*13;
    const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'rgba(104,72,36,.08)');q.addColorStop(1,'rgba(104,72,36,0)');g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2);
  }
  paperPattern=ctx.createPattern(o,'repeat');
}
makePaper();
function paperBase(warm=0){
  ctx.save();ctx.fillStyle=paperPattern;ctx.fillRect(0,0,W,H);
  const vign=ctx.createRadialGradient(W*.52,H*.46,90,W*.52,H*.46,760);vign.addColorStop(0,'rgba(255,250,232,.08)');vign.addColorStop(1,'rgba(63,48,31,.23)');ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  if(warm){ctx.fillStyle=`rgba(163,132,84,${warm*.08})`;ctx.fillRect(0,0,W,H)}
  ctx.restore();
}
function paperFiberOverlay(alpha=.12,scale=1){
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#705d43';ctx.lineCap='round';
  for(let i=0;i<150;i++){
    const y=(hash(i*9.71)*H),x=hash(i*7.13)*W,len=(40+hash(i*4.7)*220)*scale;
    ctx.lineWidth=.3+hash(i+1)*.8;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+len*.25,y+(hash(i+5)-.5)*8,x+len*.65,y+(hash(i+8)-.5)*10,x+len,y+(hash(i+2)-.5)*6);ctx.stroke();
  }ctx.restore();
}
function roughStroke(points,width=12,color=COLORS.ink,alpha=1,seed=1){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(let k=0;k<5;k++){
    ctx.strokeStyle=rgba(color,alpha*(k===0?.42:.13));ctx.lineWidth=width*(1+(hash(seed+k)-.5)*.16);
    ctx.beginPath();for(let i=0;i<points.length;i++){
      const jx=(hash(seed*91+k*17+i*13)-.5)*width*.18,jy=(hash(seed*61+k*11+i*19)-.5)*width*.15;
      const p=points[i]; if(i===0)ctx.moveTo(p[0]+jx,p[1]+jy);else ctx.lineTo(p[0]+jx,p[1]+jy);
    }ctx.stroke();
  }
  // dry edges
  ctx.globalAlpha=.25*alpha;ctx.strokeStyle='#030404';ctx.lineWidth=Math.max(1,width*.08);ctx.setLineDash([1,3+hash(seed)*4]);ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();
}
function brushCurve(x1,y1,cx1,cy1,cx2,cy2,x2,y2,width=14,color=COLORS.ink,alpha=1,seed=1){
  ctx.save();ctx.lineCap='round';
  for(let k=0;k<6;k++){
    const off=(k-2.5)*width*.018;
    ctx.beginPath();ctx.moveTo(x1,y1+off);ctx.bezierCurveTo(cx1,cy1+off,cx2,cy2-off,x2,y2);ctx.strokeStyle=rgba(color,alpha*(k===2?.3:.11));ctx.lineWidth=width*(.88+hash(seed+k)*.18);ctx.stroke();
  }ctx.restore();
}
function pseudoGlyph(x,y,s,seed,alpha=.93,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha=alpha;
  const type=Math.floor(hash(seed*1.37)*6), flip=hash(seed+8)>.5?1:-1;
  // faint letterpress halo: old ink compressing paper around the character
  ctx.save();ctx.globalAlpha=.055;ctx.strokeStyle='#4f3e2a';ctx.lineWidth=12;ctx.lineCap='round';
  if(type===0){ctx.beginPath();ctx.moveTo(-28,38);ctx.lineTo(-24,-36);ctx.moveTo(-22,-18);ctx.lineTo(26,-26);ctx.stroke()}
  else if(type===1){ctx.beginPath();ctx.moveTo(-30,36);ctx.lineTo(-26,-34);ctx.moveTo(-25,-26);ctx.quadraticCurveTo(8,-38,26,-9);ctx.quadraticCurveTo(12,10,-19,7);ctx.stroke()}
  else if(type===2){ctx.beginPath();ctx.moveTo(-29,38);ctx.lineTo(-25,-36);ctx.moveTo(-22,4);ctx.quadraticCurveTo(3,-10,28,8);ctx.moveTo(7,-21);ctx.lineTo(8,34);ctx.stroke()}
  else if(type===3){ctx.beginPath();ctx.moveTo(-30,37);ctx.lineTo(-26,-36);ctx.moveTo(-23,-29);ctx.quadraticCurveTo(8,-31,22,-12);ctx.moveTo(-21,7);ctx.lineTo(25,3);ctx.stroke()}
  else if(type===4){ctx.beginPath();ctx.moveTo(-30,37);ctx.lineTo(-25,-34);ctx.moveTo(-22,-10);ctx.lineTo(25,22);ctx.moveTo(9,-29);ctx.lineTo(10,34);ctx.stroke()}
  else {ctx.beginPath();ctx.moveTo(-30,37);ctx.lineTo(-26,-35);ctx.moveTo(-22,-27);ctx.quadraticCurveTo(11,-35,27,-8);ctx.moveTo(-19,16);ctx.quadraticCurveTo(7,5,26,24);ctx.stroke()}
  ctx.restore();
  // main press strokes; variants deliberately asymmetric so a paragraph feels typeset, not tiled.
  roughStroke([[-30,40],[-26,-38]],8.7,COLORS.ink,1,seed+1);
  if(type===0){roughStroke([[-24,-23],[19,-29],[29,-7]],6.6,COLORS.ink,.95,seed+2);roughStroke([[-18,10],[22,7]],5.4,COLORS.ink,.86,seed+3)}
  if(type===1){brushCurve(-25,-25,-3,-39,19,-31,28,-8,6.8,COLORS.ink,.96,seed+3);brushCurve(27,-8,17,9,0,12,-20,7,5.6,COLORS.ink,.88,seed+4)}
  if(type===2){brushCurve(-21,3,-4,-11,15,-3,28,10,5.8,COLORS.ink,.9,seed+5);roughStroke([[8,-27],[9,34]],6.8,COLORS.ink,.92,seed+6)}
  if(type===3){roughStroke([[-22,-29],[14,-30],[27,-12]],6.2,COLORS.ink,.93,seed+7);roughStroke([[-19,8],[26,4]],5.3,COLORS.ink,.86,seed+8)}
  if(type===4){roughStroke([[-20,-11],[25*flip,20]],6.3,COLORS.ink,.92,seed+9);roughStroke([[10,-29],[11,34]],6.2,COLORS.ink,.9,seed+10)}
  if(type===5){brushCurve(-21,-26,-2,-38,18,-29,27,-8,6.3,COLORS.ink,.93,seed+11);brushCurve(-18,17,-2,7,12,10,28,25,5.4,COLORS.ink,.85,seed+12)}
  // little worn terminals / diacritics make close frames reward inspection
  if(hash(seed+40)>.58){ctx.fillStyle=rgba(COLORS.ink,.76);ellipse(21*flip,-38,2.2+hash(seed)*1.5,1.5,.1);ctx.fill()}
  if(hash(seed+41)>.72){roughStroke([[-18,37],[27*flip,35]],4.2,COLORS.ink,.78,seed+13)}
  ctx.restore();
}
function textLandscape(offset=0,depth=1,alpha=.93){
  const baseY=465;const scale=depth; const gap=88*scale;
  for(let i=-2;i<18;i++){
    const x=(i*gap - offset%(gap))+20;
    pseudoGlyph(x,baseY+(hash(i+31)-.5)*18*scale,scale*.95,i+100,alpha,(hash(i+71)-.5)*.03);
  }
  // baseline shadow / old press residue
  ctx.save();ctx.globalAlpha=.08;ctx.fillStyle='#2c241a';ctx.fillRect(0,baseY+49*scale,W,2);ctx.restore();
}
function cobaltTrace(points,width=5,a=.6){
  ctx.save();ctx.globalCompositeOperation='multiply';
  brushCurve(points[0],points[1],points[2],points[3],points[4],points[5],points[6],points[7],width,COLORS.blue,a,77);
  ctx.restore();
}

// ---------- character ----------
function inkPerson(x,y,s,pose={}){
  const phase=pose.phase||0,run=pose.run||0,lean=pose.lean||0,alpha=pose.alpha??1,blue=pose.blue||0,flatten=pose.flatten||0,small=pose.small||0;
  ctx.save();ctx.translate(x,y);ctx.scale(s*(1-small*.28),s*(1-small*.28));ctx.rotate(lean);ctx.globalAlpha=alpha;
  if(flatten>0){
    const f=clamp(flatten);ctx.globalCompositeOperation='multiply';
    const bodyW=mix(20,170,f),bodyH=mix(50,7,f);
    ctx.fillStyle=COLORS.ink;ellipse(0,mix(-22,5,f),bodyW,bodyH,-.02);ctx.fill();
    ctx.fillStyle=rgba(COLORS.blue,.18*f);ellipse(bodyW*.15,5,bodyW*.72,bodyH*.58,0);ctx.fill();
    // capillary fingers along the dissolving edge
    if(f>.45){for(let i=0;i<5;i++){const q=remap(f,.45,1),xx=-40+i*25;ctx.strokeStyle=`rgba(18,20,20,${.18*q})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(xx,7);ctx.quadraticCurveTo(xx+18,12+hash(i)*8,xx+42*q,8+(i%2)*4);ctx.stroke()}}
    ctx.restore();return;
  }
  const bob=Math.sin(phase*TAU)*2.6*run;
  const legA=Math.sin(phase*TAU)*.86*run,legB=-legA;
  const armA=Math.sin(phase*TAU+Math.PI)*.76*run,armB=-armA;
  // soft wet stain beneath, offset from body like ink soaking through paper
  ctx.fillStyle='rgba(38,31,24,.095)';ellipse(2,29,20+run*4,4.5,0);ctx.fill();
  // trailing surface-tension fringe
  ctx.strokeStyle='rgba(16,18,18,.28)';ctx.lineWidth=1.4;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-7+i*7,17);ctx.quadraticCurveTo(-15+i*8,24+hash(i+3)*7,-9+i*7,31);ctx.stroke()}
  // torso as a slightly unstable droplet rather than a rigid oval
  ctx.beginPath();ctx.moveTo(-13,-18+bob);ctx.bezierCurveTo(-18,-6,-17,12,-9,24);ctx.bezierCurveTo(-2,33,13,24,15,7);ctx.bezierCurveTo(17,-7,10,-19,-1,-23);ctx.bezierCurveTo(-7,-26,-12,-22,-13,-18);ctx.closePath();
  const g=ctx.createLinearGradient(-18,-22,18,28);g.addColorStop(0,'#0b0d0d');g.addColorStop(.48,'#191b1b');g.addColorStop(.82,'#111313');g.addColorStop(1,'#050606');ctx.fillStyle=g;ctx.fill();
  // edge bleed + wet specular
  ctx.strokeStyle='rgba(3,5,5,.38)';ctx.lineWidth=1.1;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,246,.18)';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-7,-15+bob);ctx.bezierCurveTo(-12,-4,-9,9,-6,13);ctx.stroke();
  if(blue>0){ctx.fillStyle=rgba(COLORS.blue2,.46*blue);ellipse(6,3,4+blue*2,8+blue*3,-.22);ctx.fill();ctx.fillStyle=rgba('#a9c0cb',.16*blue);ellipse(5,-1,1.3,3,-.2);ctx.fill()}
  // head slightly pear-shaped; a separate droplet neck makes the silhouette less icon-like
  ctx.fillStyle='#101212';ctx.beginPath();ctx.moveTo(-8,-41+bob);ctx.bezierCurveTo(-11,-34,-9,-25,-1,-22);ctx.bezierCurveTo(7,-23,11,-31,8,-39);ctx.bezierCurveTo(5,-46,-4,-47,-8,-41);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,245,.16)';ellipse(-3.5,-40+bob,2.3,3.5,-.3);ctx.fill();
  ctx.fillStyle='rgba(20,22,22,.82)';ellipse(0,-24+bob,4.2,3.1,0);ctx.fill();
  // limbs with elbow/knee joints and tiny pooling feet/hands
  function limb(x1,y1,ang,len,w,seed,knee=.55){
    const ex=x1+Math.sin(ang)*len,ey=y1+Math.cos(ang)*len;
    const mx=mix(x1,ex,knee)+Math.sin(ang+1.4)*len*.10, my=mix(y1,ey,knee)+Math.cos(ang+1.4)*len*.10;
    brushCurve(x1,y1,mix(x1,mx,.6),mix(y1,my,.6),mix(mx,ex,.45),mix(my,ey,.45),ex,ey,w,COLORS.ink,.96,seed);
    ctx.fillStyle='rgba(14,16,16,.9)';ellipse(mx,my,w*.62,w*.50,0);ctx.fill();
    ctx.fillStyle='rgba(14,16,16,.82)';ellipse(ex,ey,w*.74,w*.38,ang*.2);ctx.fill();
    return[ex,ey]
  }
  limb(-5,20,legA,27,5.1,51,.52);limb(6,20,legB,27,5.1,52,.48);
  limb(-10,-8,armA,24,4.4,53,.50);limb(10,-7,armB,24,4.4,54,.55);
  if(run>.2){for(let i=0;i<3;i++){const dx=-23-i*16,dy=33+(hash(i+phase*10)-.5)*4;ctx.fillStyle='rgba(20,22,22,.15)';ellipse(dx,dy,5-i*.9,2.2,0);ctx.fill()}}
  ctx.restore();
}
function dust(x,y,p,seed=1,color='#7d6749'){
  ctx.save();for(let i=0;i<36;i++){const a=hash(seed+i)*TAU,r=(8+hash(seed+i*3)*46)*p,sz=.4+hash(seed+i*7)*1.8;ctx.globalAlpha=(1-p)*.36;ctx.fillStyle=color;ctx.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r,sz,sz)}ctx.restore();
}

// ---------- shot 01 ----------
function shot01(p){
  paperBase(); paperFiberOverlay(.12);
  const cam=easeInOut(p)*74; ctx.save();ctx.translate(-cam,0);
  // page curl creates a physical world, not a flat canvas
  const curl=ctx.createLinearGradient(0,70,0,250);curl.addColorStop(0,'rgba(74,55,34,.05)');curl.addColorStop(.5,'rgba(255,255,246,.10)');curl.addColorStop(1,'rgba(74,55,34,0)');ctx.fillStyle=curl;ctx.fillRect(0,70,1360,200);
  // out-of-focus upper lines
  ctx.save();ctx.filter='blur(1.4px)';ctx.globalAlpha=.18;for(let row=0;row<3;row++){for(let i=0;i<11;i++)pseudoGlyph(58+i*112,160+row*92,.43,i+row*50,.72,(hash(i+row)-.5)*.025)}ctx.restore();ctx.filter='none';
  // main line: uneven press and spacing are intentional
  for(let i=0;i<8;i++){const sc=.82+hash(i+19)*.12; pseudoGlyph(86+i*118,470+(hash(i+5)-.5)*4,sc,i+201,.97,(hash(i+901)-.5)*.024)}
  // one oversized foreground letter enters frame edge for depth
  ctx.save();ctx.globalAlpha=.12;ctx.filter='blur(2px)';pseudoGlyph(-40,620,2.4,78,.8,-.06);ctx.restore();ctx.filter='none';
  // incomplete terminal + tactile dry scar continuation
  roughStroke([[1012,476],[1060,471],[1092,462]],12.5,COLORS.ink,.96,401);
  for(let k=0;k<4;k++){ctx.beginPath();ctx.moveTo(1097,459+k*1.5);ctx.bezierCurveTo(1145,452,1194,466,1288,447+k*.7);ctx.strokeStyle=k<2?'rgba(255,249,231,.28)':'rgba(112,88,58,.24)';ctx.lineWidth=k<2?1.2:.75;ctx.stroke()}
  // protagonist is born from a bead, not yet fully humanoid
  const q=ss(remap(p,.50,.97)); const bx=1084,by=500;
  ctx.save();ctx.globalCompositeOperation='multiply';const rg=ctx.createRadialGradient(bx-3,by-5,1,bx,by,18+q*4);rg.addColorStop(0,'rgba(8,10,10,.98)');rg.addColorStop(.70,'rgba(18,20,20,.88)');rg.addColorStop(1,'rgba(18,20,20,.04)');ctx.fillStyle=rg;ellipse(bx,by,14+q*3,8+q*6,-.05);ctx.fill();ctx.restore();
  if(q>.58){const spr=remap(q,.58,1);ctx.strokeStyle=`rgba(12,14,14,${.5*spr})`;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(bx-5,by-3);ctx.quadraticCurveTo(bx-14,by-17,bx-11,by-24*spr);ctx.moveTo(bx+4,by-2);ctx.quadraticCurveTo(bx+12,by-15,bx+9,by-22*spr);ctx.stroke()}
  ctx.fillStyle=`rgba(255,255,248,${.17+q*.08})`;ellipse(bx-4,by-5,3.1,1.8,-.2);ctx.fill();
  ctx.restore();
  // near-lens paper fiber and a soft shadow from page above
  ctx.save();ctx.globalAlpha=.10;ctx.strokeStyle='#6e5638';ctx.lineWidth=4;ctx.filter='blur(1px)';ctx.beginPath();ctx.moveTo(-30,658);ctx.bezierCurveTo(260,610,555,700,930,650);ctx.stroke();ctx.restore();ctx.filter='none';
}
// ---------- shot 04 ----------
function shot04(p){
  paperBase();
  const speed=900, off=p*speed, horizon=475;
  // far paragraph, slight page curvature
  ctx.save();ctx.globalAlpha=.14;ctx.translate(-(off*.18)%120,0);ctx.transform(1,0,-.03,1,0,0);for(let i=-2;i<15;i++)pseudoGlyph(i*118,240+(i%3)*11,.62,i+330,.78,(hash(i+99)-.5)*.05);ctx.restore();
  // monumental middle letters. Their strokes read as architecture and occlude the runner.
  ctx.save();ctx.translate(-(off*.68)%190,0);for(let i=-2;i<10;i++){const x=i*190+65,sc=1.45+hash(i+6)*.30;ctx.save();ctx.translate(x,horizon);ctx.scale(sc,sc);pseudoGlyph(0,0,1,i+400,.82,(hash(i+33)-.5)*.025);ctx.restore()}ctx.restore();
  // thin baseline pools catch reflections
  ctx.fillStyle='rgba(30,29,24,.055)';ctx.fillRect(0,520,W,9);
  // cobalt clue underfoot
  cobaltTrace([40,526,330,510,800,542,1270,505],6,.36);
  // protagonist, larger and lower; the world cuts in front of it
  inkPerson(675,485,1.85,{run:1,phase:p*4.45,lean:-.22,blue:.30});
  // ink droplets lag according to inertia

  for(let i=0;i<9;i++){const x=350+i*46,y=463+sag+Math.sin(i*.8+p*2)*7;ctx.fillStyle='rgba(12,14,14,.75)';ellipse(x,y,7+hash(i)*6,3+hash(i+2)*3,.1);ctx.fill()}
  ctx.restore();

  // warped reflected scar travels down the wet surface as the body sags
  ctx.strokeStyle='rgba(241,233,209,.15)';ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(346,305+sag*.4);ctx.bezierCurveTo(430,282+sag*.5,535,327+sag*.55,622,291+sag*.45);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,246,.08)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(425,166);ctx.bezierCurveTo(403,245,422,335,391,402+sag);ctx.stroke();

  // A neck of ink stretches toward the drop before snapping: loss is visible as physics.
  const drop=ss(remap(p,.20,.93)), neck=Math.sin(Math.min(1,drop)*Math.PI);
  brushCurve(610,454+sag,630,500+sag,648,526+sag,651,551+sag+drop*40,5.5,COLORS.ink,.36*neck,1310);
  ctx.fillStyle='rgba(12,14,14,.92)';ellipse(651,552+sag+drop*132,10*(1-drop*.45),13*(1-drop*.33),.08);ctx.fill();
  ctx.fillStyle=`rgba(255,255,245,${.13*(1-drop)})`;ellipse(648,547+sag+drop*132,2.2,3.1,0);ctx.fill();
  // mass loss is a pale concavity at the shoulder, not a screen fade
  if(q>0){const rg=ctx.createRadialGradient(607,466+sag,4,607,466+sag,75*q);rg.addColorStop(0,`rgba(232,218,190,${.085*q})`);rg.addColorStop(1,'rgba(232,218,190,0)');ctx.fillStyle=rg;ctx.fillRect(520,380,190,180)}
}

// ---------- shot 14 : capillary return ----------
function shot14(p){
  ctx.fillStyle='#1a1c1c';ctx.fillRect(0,0,W,H);
  // paper capillary tunnel is made from racing fibers and translucent pigment veins.
  const travel=p*980;ctx.save();ctx.translate(-(travel%180),0);for(let i=-2;i<12;i++){
    const x=i*180+90;for(let j=0;j<6;j++){const y=80+j*120+(i%2)*20;ctx.strokeStyle=`rgba(183,157,115,${.10+hash(i+j)*.08})`;ctx.lineWidth=1+hash(i*4+j)*2.6;ctx.beginPath();ctx.moveTo(x-130,y-50);ctx.bezierCurveTo(x-30,y-5,x+35,y+10,x+150,y+55);ctx.stroke()}
  }ctx.restore();
  // blue path functions like a bloodstream, pulling character through.
  for(let i=0;i<7;i++){ctx.strokeStyle=`rgba(43,91,129,${.12+i*.015})`;ctx.lineWidth=2+i*.35;ctx.beginPath();ctx.moveTo(-20,360+i*6);ctx.bezierCurveTo(270,240-i*10,700,490+i*9,1310,315-i*4);ctx.stroke()}
  const cx=520+Math.sin(p*TAU*2)*50,cy=360+Math.sin(p*TAU)*75;inkPerson(cx,cy,1.35,{run:.75,phase:p*6,lean:-1.25,blue:.58,small:.14});
  // Ghosted memories: punctuation, torn hole, threads appear only for a few frames as shadows.
  const beats=[.12,.33,.54,.73];beats.forEach((b,i)=>{const a=Math.max(0,1-Math.abs(p-b)/.09);if(a<=0)return;ctx.save();ctx.globalAlpha=.19*a;ctx.filter='blur(1.3px)';if(i===0){for(let k=0;k<5;k++)punctStone(250+k*180,300+(k%2)*80,55,k%2,k+3200)}else if(i===1){ctx.strokeStyle='#eee0c1';ctx.lineWidth=18;ellipse(820,370,150,85,0);ctx.stroke()}else if(i===2){for(let k=0;k<6;k++){ctx.strokeStyle='#e1cda6';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(180+k*190,-10);ctx.bezierCurveTo(260+k*160,220,80+k*190,480,210+k*170,760);ctx.stroke()}}else{for(let k=0;k<8;k++)pseudoGlyph(120+k*145,360,.95,k+3300,.8,0)}ctx.restore();ctx.filter='none'});
  // radial streaks make speed without replacing object animation
  ctx.save();ctx.globalAlpha=.11;ctx.strokeStyle='#eadbbd';for(let i=0;i<35;i++){const y=hash(i)*H,x=hash(i+8)*W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+180+hash(i)*320,y+(hash(i+2)-.5)*25);ctx.stroke()}ctx.restore();
}

// ---------- shot 15 : return ----------
function shot15(p){
  paperBase();paperFiberOverlay(.12);
  // Mirror shot 01 composition but closer and older: visual rhyme.
  ctx.save();ctx.translate(-75,-10);for(let i=0;i<8;i++)pseudoGlyph(80+i*123,470+(hash(i+5)-.5)*4,.87,i+201,.91,(hash(i+901)-.5)*.024);roughStroke([[990,476],[1042,470],[1080,461]],12.5,COLORS.ink,.94,401);ctx.restore();
  for(let k=0;k<4;k++){ctx.strokeStyle=k<2?'rgba(255,249,231,.25)':'rgba(112,88,58,.20)';ctx.lineWidth=k<2?1.2:.75;ctx.beginPath();ctx.moveTo(1018,460+k*1.4);ctx.bezierCurveTo(1080,450,1160,469,1290,447+k);ctx.stroke()}
  // Dried footprints from outbound journey.
  ctx.fillStyle='rgba(17,19,19,.075)';for(let i=0;i<12;i++){ellipse(230+i*50,550+(i%2)*4,4.2,1.5,.15);ctx.fill()}
  // protagonist arrives already smaller; it slows to a stop instead of posing.
  const x=mix(180,755,easeOut(remap(p,.02,.72))),slow=1-remap(p,.58,.86);inkPerson(x,510,1.35,{run:clamp(slow),phase:p*3.2,lean:-.12*slow,blue:.48,small:.28});
  // A tiny residual drop is left behind on arrival, emphasizing lost mass.
  const q=ss(remap(p,.58,.95));if(q>0){ctx.fillStyle=`rgba(17,19,19,${.18*(1-q)})`;ellipse(x-35*q,535+q*8,3.5,1.8,0);ctx.fill()}
}

// ---------- shot 16 : tries and fails ----------
function shot16(p){
  paperBase();paperFiberOverlay(.14);
  ctx.save();ctx.translate(-80,15);for(let i=0;i<7;i++)pseudoGlyph(90+i*126,435,.90,i+201,.84,(hash(i+901)-.5)*.024);roughStroke([[920,445],[982,439],[1030,430]],12.2,COLORS.ink,.94,401);ctx.restore();
  const x=740,y=500;inkPerson(x,y,1.42,{run:0,phase:0,small:.28+remap(p,.45,1)*.08,blue:.45,lean:0});
  // Arm becomes the pen. It stretches, draws, thins, then breaks.
  const reach=easeInOut(remap(p,.03,.30)),draw=easeOut(remap(p,.25,.70)),dry=ss(remap(p,.62,.94));
  brushCurve(x+10,y-10,x+70,y-50,x+145,y-52,mix(x+145,930,reach),mix(y-52,446,reach),6.5,COLORS.ink,.90,3401);
  if(draw>0){const end=mix(934,1110,draw);brushCurve(930,446,980,438,end-35,450,end,440,10*(1-dry*.72),COLORS.ink,.94*(1-dry*.45),3402);ctx.save();ctx.globalCompositeOperation='multiply';brushCurve(937,445,985,441,end-45,447,end,441,2.2,COLORS.blue,.20*(1-dry),3403);ctx.restore()}
  // Dry edge physically fragments rather than fading.
  if(dry>0){for(let i=0;i<18;i++){const q=clamp(dry-i*.035);if(q<=0)continue;ctx.fillStyle=`rgba(38,33,26,${.28*(1-q)})`;ctx.fillRect(1080+hash(i)*70+q*25,430+hash(i+3)*30+q*25,1+hash(i)*2,1+hash(i+4)*2)}}
  // Arm recoil leaves body visibly smaller and asymmetric.
  if(p>.78){const r=remap(p,.78,1);ctx.fillStyle=`rgba(232,219,191,${.035*r})`;ellipse(x+15,y-5,35*r,55*r,0);ctx.fill()}
}

const TOTAL=32;
const START={};let _acc=0;for(const id of SHOTS){START[id]=_acc;_acc+=DURS[id]}
function renderShot(id,p){
  p=clamp(p);ctx.clearRect(0,0,W,H);
  switch(id){
    case'01':shot01(p);break;case'02':shot02(p);break;case'03':shot03(p);break;case'04':shot04(p);break;
    case'05':shot05(p);break;case'06':shot06(p);break;case'07':shot07(p);break;case'08':shot08(p);break;
    case'09':shot09(p);break;case'10':shot10(p);break;case'11':shot11(p);break;case'12':shot12(p);break;
    case'13':shot13(p);break;case'14':shot14(p);break;case'15':shot15(p);break;case'16':shot16(p);break;
    case'17':shot17(p);break;case'18':shot18(p);break;
  }
  ctx.save();ctx.strokeStyle='rgba(50,38,24,.055)';ctx.strokeRect(.5,.5,W-1,H-1);ctx.restore();
}
function sceneAt(t){t=Math.max(0,Math.min(TOTAL-.0001,t));for(const id of SHOTS){const s=START[id],d=DURS[id];if(t<s+d)return[id,(t-s)/d]}return['18',1]}
function renderAt(t){const [id,p]=sceneAt(t);renderShot(id,p);return{id,p}}
window.__renderAt=t=>{current=Math.max(0,Math.min(TOTAL,+t||0));const r=renderAt(current);syncUI(r.id);return r};
window.__renderShot=(id,p)=>{renderShot(String(id).padStart(2,'0'),+p||0)};window.__duration=TOTAL;window.__shots=SHOTS.slice();

// ---------- sound first pass : same event timeline as picture ----------
let ac=null, master=null, startedAt=0, audioNodes=[];
function ensureAudio(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.52;master.connect(ac.destination)}
function reg(n){audioNodes.push(n);return n}
function tone(time,freq,dur=.15,g=.05,type='sine',to=null){const o=reg(ac.createOscillator()),v=reg(ac.createGain());o.type=type;o.frequency.setValueAtTime(freq,time);if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),time+dur);v.gain.setValueAtTime(.0001,time);v.gain.exponentialRampToValueAtTime(g,time+.012);v.gain.exponentialRampToValueAtTime(.0001,time+dur);o.connect(v).connect(master);o.start(time);o.stop(time+dur+.03)}
function noise(time,dur=.12,g=.025,cut=2200){const len=Math.max(1,Math.floor(ac.sampleRate*dur)),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=reg(ac.createBufferSource()),f=reg(ac.createBiquadFilter()),v=reg(ac.createGain());s.buffer=b;f.type='lowpass';f.frequency.value=cut;v.gain.setValueAtTime(g,time);v.gain.exponentialRampToValueAtTime(.0001,time+dur);s.connect(f).connect(v).connect(master);s.start(time)}
function paper(time,dur=.3,g=.018){noise(time,dur,g,1300)}
function scheduleAudio(offset=0){ensureAudio();const now=ac.currentTime+.05, base=now-offset;startedAt=base;
  // room/paper drone built from sparse harmonics — no generic music bed at first.
  for(const [f,a] of [[73,.012],[109.5,.007],[146,.004]]){const o=reg(ac.createOscillator()),v=reg(ac.createGain());o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.0001,now);v.gain.linearRampToValueAtTime(a,now+.8);v.gain.setValueAtTime(a,base+16.45);v.gain.linearRampToValueAtTime(.0001,base+16.60);o.connect(v).connect(master);o.start(now);o.stop(base+32.2)}
  // birth / touch / run / punctuation
  tone(base+1.75,390,.22,.035,'sine',520);tone(base+2.48,520,.12,.022,'sine',610);paper(base+3.45,.18,.026);tone(base+4.08,246,.20,.018,'triangle',330);
  for(let t=4.7;t<6;t+=.22){paper(base+t,.055,.010);tone(base+t,120,.055,.010,'sine',95)}
  [6.20,6.50,6.82,7.14].forEach((t,i)=>{tone(base+t,150-i*7,.09,.038,'sine',80);noise(base+t,.07,.018,800)});
  tone(base+8.04,82,.38,.055,'sine',45);noise(base+8.08,.26,.032,1600);tone(base+8.28,420,.11,.015,'triangle',270);noise(base+8.31,.10,.015,2400);
  paper(base+9.1,.8,.020);paper(base+10.8,.7,.016);
  // river becomes rhythmic: pencil-scratch pulse turns into music
  for(let t=12;t<15;t+=.375){paper(base+t,.07,.012);tone(base+t,110+(Math.floor((t-12)/.375)%4)*18,.11,.012,'triangle')}
  noise(base+13.96,.34,.045,900);tone(base+14.02,67,.46,.060,'sine',36);
  // canyon; sparse pulse then absolute cut at truth
  for(let t=15.05;t<16.45;t+=.36)tone(base+t,92,.10,.012,'sine',75);
  paper(base+16.72,.72,.036);noise(base+16.98,.20,.020,1900);noise(base+17.22,.38,.020,1050);
  // understanding drop
  tone(base+19.05,310,.22,.018,'sine',240);noise(base+19.15,.11,.010,700);
  // return replays earlier timbres backwards in pitch
  [19.68,19.92,20.16,20.40,20.64].forEach((t,i)=>{tone(base+t,510-i*62,.13,.025,'triangle',330-i*35);paper(base+t,.08,.010)});
  // arrival / failed line
  paper(base+21.3,.22,.015);paper(base+22.75,.50,.025);noise(base+23.75,.32,.018,650);
  // sacrifice: long breath-like filtered noise + low tone
  noise(base+24.55,2.9,.028,520);tone(base+24.62,82,2.6,.026,'sine',61);paper(base+25.45,.55,.014);paper(base+26.25,.70,.012);
  // bloom: original single note becomes a chord, one note at a time as pigment spreads
  [[27.62,196],[28.08,246.94],[28.48,293.66],[28.88,392],[29.34,493.88]].forEach(([t,f],i)=>tone(base+t,f,3.1-i*.22,.023+i*.0045,'sine'));
  [27.82,28.30,28.72,29.12,29.60,30.05].forEach((t,i)=>paper(base+t,.16,.006+i*.0007));
  for(let t=28;t<31.3;t+=.42)paper(base+t,.08,.005);
}
function stopAudio(){if(!ac)return;for(const n of audioNodes){try{if(n.stop)n.stop()}catch(e){}try{n.disconnect()}catch(e){}}audioNodes=[]}

let current=0, playing=false, raf=0, wallStart=0;
function syncUI(id){document.getElementById('scrub').value=current;document.getElementById('time').textContent=`${current.toFixed(1)} / 32.0s`;document.getElementById('shot').textContent=`SHOT ${id} · ${shotLabels[id]}`;document.getElementById('play').textContent=playing?'■ STOP':'▶ PLAY'}
function tick(now){if(!playing)return;current=(now-wallStart)/1000;if(current>=TOTAL){current=TOTAL;playing=false;stopAudio();renderAt(TOTAL-.001);syncUI('18');return}const r=renderAt(current);syncUI(r.id);raf=requestAnimationFrame(tick)}
async function play(){if(playing){playing=false;cancelAnimationFrame(raf);stopAudio();syncUI(sceneAt(current)[0]);return}ensureAudio();if(ac.state==='suspended')await ac.resume();stopAudio();scheduleAudio(current);playing=true;wallStart=performance.now()-current*1000;raf=requestAnimationFrame(tick);syncUI(sceneAt(current)[0])}
document.getElementById('play').onclick=play;
document.getElementById('scrub').oninput=e=>{if(playing){playing=false;cancelAnimationFrame(raf);stopAudio()}current=+e.target.value;const r=renderAt(Math.min(current,TOTAL-.001));syncUI(r.id)};
document.getElementById('mute').onclick=()=>{ensureAudio();master.gain.value=master.gain.value>.01?0:.52;document.getElementById('mute').textContent=master.gain.value>.01?'🔊 SOUND':'🔇 MUTED'};
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
renderAt(0);syncUI('01');
})();
</script></body></html>
